<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: #992424;
      color: #fff;
    }
    header {
      background: #a76a6a;
      padding: 20px;
    }
    nav a {
      margin: 0 15px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
    }
    section {
      display: none; /* hide by default */
      padding: 40px;
    }
    section.active {
      display: block; /* show only when active */
    }
    /* Profile picture style */
    #home img {
      width: 180px;          /* fixed size */
      height: 180px;
      object-fit: cover;     /* crop nicely */
      border-radius: 50%;    /* circular */
      border: 4px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      margin-top: 20px;
    }
    /* Gallery images */
    #gallery img {
      width: 200px;
      height: auto;
      margin: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    /* Dark mode */
    .dark-mode {
      background: #111;
      color: #eee;
    }
    .dark-mode header {
      background: #000;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a onclick="showSection('home')">Home</a>
      <a onclick="showSection('about')">About</a>
      <a onclick="showSection('settings')">Settings</a>
      <a onclick="showSection('pictures')">Pictures</a>
    </nav>
  </header>

  <!-- Sections -->
  <section id="home" class="active"> <!-- show Home by default -->
    <h2>brentoy</h2>
    <img src="Images/background.jpg" alt="Profile picture">
  </section>

  <section id="about">
    <h2>About Me</h2>
    <p>Hello! I'm Brent Rhymen Crisantine Constantino Española.</p>
  </section>

  <section id="settings">
    <h2>Settings</h2>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
  </section>

  <section id="pictures">
    <h2>My Pictures</h2>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div id="gallery"></div>
  </section>

  <script>
    // Show only the clicked section
    function showSection(id) {
      document.querySelectorAll("section").forEach(sec => {
        sec.classList.remove("active");
      });
      document.getElementById(id).classList.add("active");
    }

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    // Image Upload Preview
    const fileInput = document.getElementById("fileInput");
    const gallery = document.getElementById("gallery");

    fileInput.addEventListener("change", () => {
      gallery.innerHTML = "";
      Array.from(fileInput.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = document.createElement("img");
          img.src = e.target.result;
          gallery.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
